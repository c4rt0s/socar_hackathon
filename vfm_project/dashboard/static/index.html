      const an = (adv.analytical_match && adv.analytical_match.available) ? adv.analytical_match : null;
      const dc = (adv.deconvolution && adv.deconvolution.available) ? adv.deconvolution : null;
      const ilk = (adv.ilk_bspline_deconv && adv.ilk_bspline_deconv.available) ? adv.ilk_bspline_deconv : null;
      const ag = (adv.agarwal_equiv && adv.agarwal_equiv.available) ? adv.agarwal_equiv : null;
      const bl = (adv.blasingame_integral && adv.blasingame_integral.available) ? adv.blasingame_integral : null;
      const oj = (adv.odeh_jones_multirate && adv.odeh_jones_multirate.available) ? adv.odeh_jones_multirate : null;
      const td = (adv.tiab_tds && adv.tiab_tds.available) ? adv.tiab_tds : null;
      const mdh = (adv.mdh_muskat && adv.mdh_muskat.available) ? adv.mdh_muskat : null;

      // Resolve ONLY the currently selected methodology (or active Manual 2-Point override!)
      const selEl = root.querySelector('#pta-src-sel');
      if (selEl && selEl.value !== activePtaMethod) selEl.value = activePtaMethod;

      const methodLookup = {
        hybrid_intersection: hyb ? { key: 'hybrid_intersection', badge: 'HYBRID L3 AUTO', color: '#0f9960', ...l3, win_hr: hyb.intersect_win_hr, kpi3Lbl: 'IARF Consensus Window', kpi3Val: fmt(hyb.intersect_win_hr[0], 2) + '–' + fmt(hyb.intersect_win_hr[1], 2) + ' h', kpi3Sub: 'Horner R² = ' + fmt(hyb.r2_horner, 4) + ' · Span ' + fmt(hyb.intersect_span_cyc, 2) + ' cyc', kpi4Lbl: 'Reliability Confidence', kpi4Val: fmt(hyb.confidence_score, 0) + ' / 100', kpi4Chip: hyb.confidence_rating + ' CONFIDENCE', kpi4Cls: hyb.confidence_rating === 'HIGH' ? 'green' : 'blue' } : null,
        stehfest_analytical: an ? { key: 'stehfest_analytical', badge: 'STEHFEST ANALYTICAL', color: '#db3737', ...an, kpi3Lbl: 'Type-Curve Match (WBS + Bnd)', kpi3Val: 'der ' + fmt(an.deriv_mape_pct, 1) + '% MAPE', kpi3Sub: 'C=' + fmt(an.c_bbl_psi, 4) + ' bbl/psi · r_e=' + fmt(an.re_ft, 0) + ' ft (' + fmt(an.drainage_area_acres, 0) + ' ac)', kpi4Lbl: 'Active Methodology', kpi4Val: 'STEHFEST 12', kpi4Chip: 'k ±' + fmt(an.k_std_pct, 1) + '% · S ±' + fmt(an.skin_std, 2), kpi4Cls: 'blue' } : null,
        von_schroeter_deconv: dc ? { key: 'von_schroeter_deconv', badge: 'VON SCHROETER DECONV', color: '#0284c7', ...dc, kpi3Lbl: 'Deconvolved Horizon', kpi3Val: fmt(dc.horizon_hr, 0) + ' hr', kpi3Sub: 'BU Fit RMSE = ' + fmt(dc.bu_fit_rmse_psi, 2) + ' psi · ' + dc.n_rate_steps + ' VFM steps', kpi4Lbl: 'Active Methodology', kpi4Val: 'DECONV SPE-77688', kpi4Chip: 'Nonlinear Log-Spline', kpi4Cls: 'blue' } : null,
        ilk_bspline_deconv: ilk ? { key: 'ilk_bspline_deconv', badge: 'ILK B-SPLINE DECONV', color: '#7c3aed', ...ilk, kpi3Lbl: 'Convex B-Spline Horizon', kpi3Val: fmt(ilk.horizon_hr, 0) + ' hr', kpi3Sub: 'BU Fit RMSE = ' + fmt(ilk.bu_fit_rmse_psi, 2) + ' psi · ' + ilk.n_basis + ' B-splines', kpi4Lbl: 'Active Methodology', kpi4Val: 'ILK SPE-102869', kpi4Chip: 'Strictly Convex NNLS', kpi4Cls: 'blue' } : null,
        agarwal_equiv: ag ? { key: 'agarwal_equiv', badge: 'AGARWAL Δt_e', color: '#0f9960', ...ag, kpi3Lbl: 'Agarwal Δt_e Window', kpi3Val: fmt(ag.win_hr[0], 2) + '–' + fmt(ag.win_hr[1], 2) + ' h', kpi3Sub: 'Semilog R² = ' + fmt(ag.r2_semilog, 4) + ' · p* = ' + fmt(ag.p_star, 1) + ' psia', kpi4Lbl: 'Active Methodology', kpi4Val: 'AGARWAL SPE-9289', kpi4Chip: 'Equivalent Time Δt_e', kpi4Cls: 'green' } : null,
        blasingame_integral: bl ? { key: 'blasingame_integral', badge: 'BLASINGAME ΔP_id', color: '#d9822b', ...bl, kpi3Lbl: 'Integral Derivative Window', kpi3Val: fmt(bl.win_hr[0], 2) + '–' + fmt(bl.win_hr[1], 2) + ' h', kpi3Sub: 'Noise-immune ΔP_id + ΔP_idd · P\'_r=' + fmt(bl.radial_deriv_asymptote_psi, 1) + ' psi', kpi4Lbl: 'Active Methodology', kpi4Val: 'BLASINGAME 19099', kpi4Chip: 'Pressure-Integral Filter', kpi4Cls: 'amber' } : null,
        odeh_jones_multirate: oj ? { key: 'odeh_jones_multirate', badge: 'ODEH-JONES MULTI-RATE', color: '#184a90', ...oj, kpi3Lbl: 'Superposition Window', kpi3Val: fmt(oj.win_hr[0], 2) + '–' + fmt(oj.win_hr[1], 2) + ' h', kpi3Sub: oj.n_rate_steps + ' VFM rate steps · R² = ' + fmt(oj.r2_superpos, 4), kpi4Lbl: 'Active Methodology', kpi4Val: 'ODEH-JONES 1082', kpi4Chip: 'Variable-Rate Superpos.', kpi4Cls: 'blue' } : null,
        tiab_tds: td ? { key: 'tiab_tds', badge: 'TIAB DIRECT SYNTHESIS', color: '#0f766e', ...td, kpi3Lbl: 'WBS Hump Anchor', kpi3Val: 't_pk = ' + fmt(td.t_peak_hr, 3) + ' h', kpi3Sub: 'C = ' + fmt(td.c_bbl_psi, 4) + ' bbl/psi · C_D = ' + fmt(td.c_d, 0), kpi4Lbl: 'Active Methodology', kpi4Val: 'TIAB TDS 26138', kpi4Chip: 'Direct Anchor Synthesis', kpi4Cls: 'green' } : null,
        mdh_muskat: mdh ? { key: 'mdh_muskat', badge: 'MDH + MUSKAT', color: '#475569', ...mdh, kpi3Lbl: 'Muskat Compartment p̄', kpi3Val: mdh.p_bar_muskat_psia ? fmt(mdh.p_bar_muskat_psia, 1) + ' psia' : '—', kpi3Sub: 'MDH [' + fmt(mdh.win_hr[0], 2) + '–' + fmt(mdh.win_hr[1], 2) + ' h]' + (mdh.muskat_r2 ? ' · Muskat R²=' + fmt(mdh.muskat_r2, 4) : ''), kpi4Lbl: 'Active Methodology', kpi4Val: 'MDH / MUSKAT', kpi4Chip: 'tp-Independent Semilog', kpi4Cls: 'blue' } : null,
        hybrid_horner: hyb ? { key: 'hybrid_horner', badge: 'HYBRID L1: HORNER', color: '#2d72d2', ...l1, win_hr: l1.win_hr, kpi3Lbl: 'Horner Theil-Sen Window', kpi3Val: fmt(l1.win_hr[0], 2) + '–' + fmt(l1.win_hr[1], 2) + ' h', kpi3Sub: 'PELT change-point + robust Horner slope', kpi4Lbl: 'Active Methodology', kpi4Val: 'HYBRID L1', kpi4Chip: 'Horner-Only Logic', kpi4Cls: 'blue' } : null,
        hybrid_bourdet: hyb ? { key: 'hybrid_bourdet', badge: 'HYBRID L2: BOURDET', color: '#d9822b', ...l2, win_hr: l2.win_hr, kpi3Lbl: 'Bourdet Plateau Window', kpi3Val: fmt(l2.win_hr[0], 2) + '–' + fmt(l2.win_hr[1], 2) + ' h', kpi3Sub: 'Bourdet L=0.15 sliding window + PELT', kpi4Lbl: 'Active Methodology', kpi4Val: 'HYBRID L2', kpi4Chip: 'Bourdet-Only Logic', kpi4Cls: 'amber' } : null
      };

      const chosen = mf ? null : (methodLookup[activePtaMethod] || methodLookup.hybrid_intersection);
      const activeSrc = mf || chosen || null;
      const kVal = activeSrc ? activeSrc.k : res.k_md;
      const khVal = activeSrc ? activeSrc.kh : res.kh_md_ft;
      const sVal = activeSrc ? activeSrc.skin : res.apparent_skin;
      const mVal = activeSrc ? activeSrc.m : res.semilog_slope_psi_per_cycle;
      const dpVal = activeSrc ? activeSrc.dP_skin : res.skin_pressure_drop_psi;
      const winActive = mf ? mf.win_hr : ((chosen && chosen.win_hr) ? chosen.win_hr : (hyb ? hyb.intersect_win_hr : null));
      const accentColor = mf ? '#7c3aed' : (chosen ? chosen.color : '#184a90');

      root.querySelector('#pta-kpis').innerHTML =
        '<div class="kpi-card"><span class="kpi-lbl">Permeability (k)</span><span class="kpi-val" style="color:' + accentColor + ';">' + fmt(kVal, 2) + ' mD</span><span class="kpi-sub">kh = ' + fmt(khVal, 0) + ' mD·ft · m = ' + fmt(mVal, 2) + ' psi/cyc</span></div>' +
        '<div class="kpi-card"><span class="kpi-lbl">Skin Factor (S)</span><span class="kpi-val">' + (sVal >= 0 ? '+' : '') + fmt(sVal, 2) + '</span><span class="kpi-sub">ΔP_skin = ' + fmt(dpVal, 1) + ' psi</span></div>' +
        '<div class="kpi-card"><span class="kpi-lbl">' + esc(mf ? 'Manual 2-Point Window' : (chosen ? chosen.kpi3Lbl : 'IARF Window')) + '</span><span class="kpi-val" style="color:' + accentColor + ';font-size:18px;">' + esc(mf ? (fmt(mf.win_hr[0], 2) + '–' + fmt(mf.win_hr[1], 2) + ' h') : (chosen ? chosen.kpi3Val : '—')) + '</span><span class="kpi-sub">' + esc(mf ? ('Horner R² = ' + fmt(mf.r2_horner, 4) + ' · Span ' + fmt(mf.span_cyc, 2) + ' cyc') : (chosen ? chosen.kpi3Sub : '—')) + '</span></div>' +
        '<div class="kpi-card"><span class="kpi-lbl">' + esc(mf ? 'Analysis Mode' : (chosen ? chosen.kpi4Lbl : 'Status')) + '</span><span class="kpi-val" style="font-size:17px;">' + esc(mf ? 'MANUAL FIT' : (chosen ? chosen.kpi4Val : '—')) + '</span><span class="kpi-sub">' + (mf ? '<span class="chip" style="background:#f3e8ff;color:#6d28d9;">' + esc(mf.fit_mode === 'interval_ols' ? 'Interval OLS [P1–P2]' : 'Exact 2-Point Line') + '</span>' : '<span class="chip ' + esc(chosen ? chosen.kpi4Cls : 'blue') + '">' + esc(chosen ? chosen.kpi4Chip : d.status) + '</span>') + '</span></div>';

      if (hyb) {
        const c = hyb.checks || {};
        const badge = (lbl, v) => '<span class="chip ' + (v === 'PASS' ? 'green' : 'amber') + '" style="margin-right:6px;">' + esc(lbl) + ': ' + esc(v) + '</span>';
        root.querySelector('#pta-checks').innerHTML =
          (mf ? '<span class="chip" style="background:#f3e8ff;color:#6d28d9;margin-right:6px;">Manual Override Active</span>' : '<span class="chip blue" style="margin-right:6px;">Viewing: ' + esc(chosen ? chosen.badge : activePtaMethod) + '</span>') +
          badge('Plateau', c.plateau) + badge('Horner R²', c.horner) + badge('Duration', c.duration) +
          badge('Smoothing (L=0.10..0.20)', c.smoothing) + badge('Intersection', c.intersection);
        root.querySelector('#pta-win-summary').textContent =
          'Slope=' + fmt(hyb.log_log_slope, 3) + ' · CV=' + fmt(hyb.deriv_cv_pct, 1) + '% · Smooth Drift=' + fmt(hyb.smooth_drift_pct, 2) + '% · Qo=' + fmt(hyb.qo_stbd, 1) + ' STB/d';
      }

      // Regime Triage & Hidden-IARF Guidance Banner
      const regBar = root.querySelector('#pta-regime-banner');
      if (regBar && adv && adv.available) {
        const isWarn = adv.regime_status !== 'CLEAR_IARF';
        regBar.style.display = 'block';
        regBar.style.borderLeftColor = adv.regime_status === 'NO_CLEAR_IARF' ? '#db3737' : (isWarn ? '#d9822b' : '#0f9960');
        regBar.innerHTML =
          '<div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px;">' +
            '<div><span class="chip ' + (adv.regime_status === 'CLEAR_IARF' ? 'green' : 'amber') + '" style="margin-right:8px;">' + esc(adv.regime_label) + '</span>' +
            '<strong>Recommended:</strong> ' + esc(adv.recommended_method) + '</div>' +
            (an ? '<span class="small-muted" style="font-family:var(--mono);">WBS C=' + fmt(an.c_bbl_psi, 4) + ' bbl/psi · r_e=' + fmt(an.re_ft, 0) + ' ft (' + fmt(an.drainage_area_acres, 0) + ' ac) · P\'_r=' + fmt(an.radial_deriv_asymptote_psi, 1) + ' psi</span>' : '') +
          '</div>' +
          '<div class="small-muted" style="color:#394b59;line-height:1.45;">' + esc(adv.guidance) + '</div>';
      } else if (regBar) {
        regBar.style.display = 'none';
      }

      // 1. Log-Log Diagnostic Plot — shows ONLY the active selected methodology cleanly!
      const ser = d.series || {};
      const dt = ser.dt_hr || [], dp = ser.dp_psi || [], der = ser.derivative_psi || [];
      const hLo = winActive ? winActive[0] : null, hHi = winActive ? winActive[1] : null;
      const dpPts = [], derPts = [], winPts = [];
      let dtMinP = Infinity, dtMaxP = 0;
      for (let i = 0; i < dt.length; i++) {
        const x = dt[i];
        if (!(x > 0)) continue;
        if (x < dtMinP) dtMinP = x;
        if (x > dtMaxP) dtMaxP = x;
        if (dp[i] > 0) dpPts.push({ x, y: dp[i] });
        if (der[i] > 0) {
          if (hLo != null && x >= hLo && x <= hHi) winPts.push({ x, y: der[i] });
          else derPts.push({ x, y: der[i] });
        }
      }
      const logSub = root.querySelector('#pta-loglog-sub');
      const logDatasets = [
        { label: 'ΔP (psi)', data: dpPts, borderColor: '#2d72d2', backgroundColor: '#2d72d2', pointRadius: 2.6 }
      ];
      let xLogTitle = 'Shut-in Time Δt (hours)';

      if (mf) {
        logDatasets.push({ label: 'Bourdet Derivative P\' (psi)', data: derPts, borderColor: '#d9822b', backgroundColor: '#d9822b', pointRadius: 2.6 });
        logDatasets.push({ label: 'Manual 2-Point IARF', data: winPts, borderColor: '#5b21b6', backgroundColor: '#7c3aed', borderWidth: 1.5, pointRadius: 5.0 });
        if (logSub) logSub.textContent = 'Showing: Engineer Manual 2-Point Fit';
      } else if (activePtaMethod === 'stehfest_analytical' && an) {
        logDatasets.push({ label: 'Bourdet Derivative P\' (psi)', data: derPts.concat(winPts), borderColor: '#d9822b', backgroundColor: '#d9822b', pointRadius: 2.6 });
        logDatasets.push({ label: 'Stehfest Model ΔP (MAPE ' + fmt(an.dp_mape_pct, 1) + '%)', data: an.curve_dp || [], showLine: true, borderColor: 'rgba(219,55,55,0.75)', borderWidth: 1.9, pointRadius: 0 });
        logDatasets.push({ label: 'Stehfest Model P\' (MAPE ' + fmt(an.deriv_mape_pct, 1) + '%)', data: an.curve_der || [], showLine: true, borderColor: '#db3737', borderWidth: 2.3, pointRadius: 0 });
        if (logSub) logSub.textContent = 'Showing: Stehfest 12-Term Analytical Type-Curve Match';
      } else if (activePtaMethod === 'von_schroeter_deconv' && dc) {
        logDatasets.push({ label: 'Raw Bourdet P\' (psi)', data: derPts.concat(winPts), borderColor: 'rgba(217,130,43,0.45)', backgroundColor: 'rgba(217,130,43,0.45)', pointRadius: 2.2 });
        logDatasets.push({ label: 'von Schroeter Deconv P\'_eq (to ' + fmt(dc.horizon_hr, 0) + 'h)', data: dc.curve_der || [], showLine: true, borderColor: '#0284c7', borderWidth: 2.3, pointRadius: 0 });
        logDatasets.push({ label: 'Deconvolved Drawdown ΔP_eq', data: dc.curve_dp || [], showLine: true, borderColor: 'rgba(2,132,199,0.55)', borderDash: [4, 3], borderWidth: 1.6, pointRadius: 0 });
        if (logSub) logSub.textContent = 'Showing: von Schroeter VFM-Coupled Deconvolution (SPE-77688)';
      } else if (activePtaMethod === 'ilk_bspline_deconv' && ilk) {
        logDatasets.push({ label: 'Raw Bourdet P\' (psi)', data: derPts.concat(winPts), borderColor: 'rgba(217,130,43,0.45)', backgroundColor: 'rgba(217,130,43,0.45)', pointRadius: 2.2 });
        logDatasets.push({ label: 'Ilk B-Spline Deconv P\'_eq (to ' + fmt(ilk.horizon_hr, 0) + 'h)', data: ilk.curve_der || [], showLine: true, borderColor: '#7c3aed', borderWidth: 2.3, pointRadius: 0 });
        logDatasets.push({ label: 'B-Spline Drawdown ΔP_eq', data: ilk.curve_dp || [], showLine: true, borderColor: 'rgba(124,58,237,0.55)', borderDash: [4, 3], borderWidth: 1.6, pointRadius: 0 });
        if (logSub) logSub.textContent = 'Showing: Ilk–Valkó–Blasingame Convex B-Spline Deconvolution (SPE-102869)';
      } else if (activePtaMethod === 'agarwal_equiv' && ag) {
        const agAll = ag.curve_der || [];
        const agIn = ag.win_hr ? agAll.filter(p => p.x >= ag.win_hr[0] && p.x <= ag.win_hr[1]) : [];
        const agOut = ag.win_hr ? agAll.filter(p => p.x < ag.win_hr[0] || p.x > ag.win_hr[1]) : agAll;
        logDatasets.push({ label: 'Agarwal Bourdet P\'(Δt_e)', data: agOut, borderColor: '#d9822b', backgroundColor: '#d9822b', pointRadius: 2.8 });
        logDatasets.push({ label: 'Agarwal IARF Segment (Δt_e)', data: agIn, borderColor: '#065f46', backgroundColor: '#0f9960', borderWidth: 1.5, pointRadius: 5.0 });
        xLogTitle = 'Agarwal Equivalent Time Δt_e = tp·Δt / (tp + Δt) (hours)';
        if (logSub) logSub.textContent = 'Showing: Agarwal Equivalent-Time Bourdet Derivative (SPE-9289)';
      } else if (activePtaMethod === 'blasingame_integral' && bl) {
        logDatasets.push({ label: 'Raw Bourdet P\' (psi)', data: derPts.concat(winPts), borderColor: 'rgba(148,163,184,0.45)', backgroundColor: 'rgba(148,163,184,0.45)', pointRadius: 2.0 });
        logDatasets.push({ label: 'Pressure Integral ΔP_i (psi)', data: bl.curve_dp || [], showLine: true, borderColor: 'rgba(45,114,210,0.65)', borderDash: [4, 3], borderWidth: 1.6, pointRadius: 0 });
        logDatasets.push({ label: 'Blasingame Integral Deriv ΔP_id+ΔP_idd', data: bl.curve_der || [], showLine: true, borderColor: '#d9822b', borderWidth: 2.4, pointRadius: 0 });
        if (logSub) logSub.textContent = 'Showing: Blasingame Noise-Immune Pressure Integral (SPE-19099)';
      } else {
        logDatasets.push({ label: 'Bourdet Derivative P\' (psi)', data: derPts, borderColor: '#d9822b', backgroundColor: '#d9822b', pointRadius: 2.6 });
        logDatasets.push({ label: (chosen ? chosen.badge : 'IARF') + ' Segment', data: winPts, borderColor: '#065f46', backgroundColor: '#0f9960', borderWidth: 1.5, pointRadius: 4.8 });
        if (logSub) logSub.textContent = 'Showing: ' + (chosen ? chosen.badge : activePtaMethod) + ' · Scroll/Drag axes to rescale';
      }

      // Draw exact horizontal True Radial Asymptote P'_r = m / 2.3026 for the currently selected method!
      const pRadLine = mVal > 0 ? (mVal / 2.302585) : null;
      if (pRadLine && isFinite(dtMinP) && dtMaxP > dtMinP) {
        const xHiLine = (activePtaMethod === 'von_schroeter_deconv' && dc) ? dc.horizon_hr : ((activePtaMethod === 'ilk_bspline_deconv' && ilk) ? ilk.horizon_hr : dtMaxP);
        logDatasets.push({
          label: 'Radial Asymptote P\'_r (' + fmt(pRadLine, 1) + ' psi)',
          data: [{ x: dtMinP, y: pRadLine }, { x: xHiLine, y: pRadLine }],
          showLine: true, borderColor: 'rgba(15,153,96,0.80)', borderDash: [6, 4], borderWidth: 1.6, pointRadius: 0
        });
      }

      const logPlugins = [makePtaPinPlugin('loglog')];
      if (logZoomHandle) logPlugins.push(logZoomHandle.hoverPlugin);
      logChart = chart(root.querySelector('#pta-loglog-canvas'), {
        type: 'scatter',
        data: { datasets: logDatasets },
        plugins: logPlugins,
        options: {
          plugins: {
            legend: { position: 'top', labels: { usePointStyle: true, font: { size: 10.5 }, boxWidth: 10 } },
            tooltip: {
              callbacks: {
                label: ctx => ctx.dataset.label + ': t=' + fmt(ctx.parsed.x, 3) + ' hr, ' + fmt(ctx.parsed.y, 2) + ' psi'
              }
            }
          },
          scales: {
            x: { type: 'logarithmic', title: { display: true, text: xLogTitle } },
            y: { type: 'logarithmic', afterFit: s => { s.width = Math.max(s.width, 64); }, title: { display: true, text: 'ΔP and Derivative (psi)' } }
          }
        }
      });

      // 2. Horner Semilog Plot — dynamically fits & extrapolates straight line to p* at log10(H) = 0!
      const hp = d.horner_plot || {};
      const hPts = hp.points || [];
      const hInWin = winActive ? hPts.filter(p => p.dt >= winActive[0] && p.dt <= winActive[1]) : [];
      let fitLine = hp.fit_line || [];
      let pStarShow = hp.p_star_psi;
      if (mf && mf.p_star_psi != null && isFinite(mf.p_star_psi)) {
        pStarShow = Number(mf.p_star_psi);
      }
      if (!mf && mVal > 0 && hPts.length >= 4) {
        const anchorSet = hInWin.length >= 3 ? hInWin : hPts.slice(Math.floor(hPts.length * 0.45), Math.floor(hPts.length * 0.85));
        if (anchorSet.length >= 2) {
          const pStars = anchorSet.map(p => p.y + mVal * p.x).sort((a, b) => a - b);
          pStarShow = (chosen && chosen.p_star) ? chosen.p_star : pStars[Math.floor(pStars.length / 2)];
          const xHi = Math.min(Math.max(...anchorSet.map(p => p.x)) + 0.35, Math.max(...hPts.map(p => p.x)));
          fitLine = [{ x: xHi, y: pStarShow - mVal * xHi }, { x: 0.0, y: pStarShow }];
        }
      } else if (mf && mVal > 0 && isFinite(pStarShow)) {
        const xHi = fitLine.length ? Math.max(...fitLine.map(p => p.x)) : (hPts.length ? Math.max(...hPts.map(p => p.x)) : 3.0);
        fitLine = [{ x: xHi, y: pStarShow - mVal * xHi }, { x: 0.0, y: pStarShow }];
      }
      const pStarPoint = (pStarShow != null && isFinite(pStarShow)) ? [{ x: 0.0, y: Number(pStarShow) }] : [];
      const lineTag = mf ? 'MANUAL' : (chosen ? chosen.badge : 'HORNER');
      root.querySelector('#pta-horner-sub').textContent =
        '[' + lineTag + '] p* = ' + fmt(pStarShow, 1) + ' psia · m = ' + fmt(mVal, 2) + ' psi/cycle';

      const pStarLabelPlugin = {
        id: 'pStarLabel',
        afterDatasetsDraw(ch) {
          if (!pStarPoint.length) return;
          const xScale = ch.scales.x, yScale = ch.scales.y, area = ch.chartArea;
          if (!xScale || !yScale || !area) return;
          const px = xScale.getPixelForValue(0.0);
          const py = yScale.getPixelForValue(pStarPoint[0].y);
          if (!isFinite(px) || !isFinite(py)) return;
          const ctx = ch.ctx;
          ctx.save();
          // Subtle horizontal dotted reference line at Pws = p*
          if (py >= area.top && py <= area.bottom) {
            ctx.strokeStyle = 'rgba(219, 55, 55, 0.45)';
            ctx.lineWidth = 1.2;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(area.left, py);
            ctx.lineTo(Math.min(px, area.right), py);
            ctx.stroke();
            ctx.setLineDash([]);
          }
          // Crisp pill badge showing p* = XXXX.X psia right next to (0, p*)
          const label = 'p* = ' + fmt(pStarPoint[0].y, 1) + ' psia';
          ctx.font = '700 11px Consolas, monospace';
          const tw = ctx.measureText(label).width;
          const bw = tw + 12, bh = 20;
          const bx = Math.max(area.left + 4, Math.min(px - bw - 10, area.right - bw - 4));
          const by = Math.max(area.top + 4, Math.min(py - bh / 2, area.bottom - bh - 4));
          ctx.fillStyle = 'rgba(255, 255, 255, 0.94)';
          ctx.strokeStyle = '#db3737';
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.roundRect ? ctx.roundRect(bx, by, bw, bh, 4) : ctx.rect(bx, by, bw, bh);
          ctx.fill();

      const hornerPlugins = [makePtaPinPlugin('horner'), pStarLabelPlugin];
      if (hornerZoomHandle) hornerPlugins.push(hornerZoomHandle.hoverPlugin);
      hornerChart = chart(root.querySelector('#pta-horner-canvas'), {
        type: 'scatter',

          datasets: [
            { label: 'Measured Pws (psia)', data: hPts, borderColor: '#8a9ba8', backgroundColor: '#8a9ba8', pointRadius: 2.5 },

            { label: 'p* Extrapolated (' + fmt(pStarShow, 1) + ' psia)', data: pStarPoint, borderColor: '#b91c1c', backgroundColor: '#ef4444', pointStyle: 'star', pointRadius: 8, borderWidth: 2 }

                  return ctx.dataset.label + ': log10(H)=' + fmt(ctx.parsed.x, 3) + ', Pws=' + fmt(ctx.parsed.y, 1) + ' psia' + dtTxt;
                }

            y: { afterFit: s => { s.width = Math.max(s.width, 64); }, title: { display: true, text: 'Shut-in Bottomhole Pressure Pws (psia)' } }
          }
        }
      });

      // 2b. Oil Rate (Qo) Sensitivity Tornado & Root-Cause Diagnostics (synced live to active method!)
      renderPTATornado(d, kVal, khVal, sVal, mVal);

      // 3. Automated Reservoir Behaviour Interpretation Cards (dynamically synced to selected method!)
      const it = d.interpretation || {};
      const itag = root.querySelector('#pta-interp-tag');
      if (itag) itag.textContent = mf ? 'Based on Engineer Manual 2-Point Fit' : ('Diagnosis (' + (chosen ? chosen.badge : 'Hybrid') + ')');
      const permCls = kVal >= 150 ? 'High-Permeability Reservoir' : (kVal >= 50 ? 'Moderate-to-Good Permeability' : 'Moderate-Tight Formation');
      const skinCls = sVal >= 3 ? 'Damaged Wellbore (Stimulation Candidate)' : (sVal >= 0.5 ? 'Mild Near-Wellbore Damage' : (sVal >= -1 ? 'Clean / Undamaged Wellbore' : 'Stimulated / Enhanced Near-Wellbore'));
      root.querySelector('#pta-interp-grid').innerHTML =
        '<div class="interp-card"><h4>Permeability: ' + esc(permCls) + '</h4><p>' + esc(chosen ? ('Selected ' + chosen.badge + ' estimates k = ' + fmt(kVal, 1) + ' mD (kh = ' + fmt(khVal, 0) + ' mD·ft, m = ' + fmt(mVal, 2) + ' psi/cycle).') : (it.permeability_summary || '—')) + '</p></div>' +
        '<div class="interp-card" style="border-left-color:#0f9960;"><h4>Wellbore Condition: ' + esc(skinCls) + '</h4><p>' + esc('Apparent skin S = ' + (sVal >= 0 ? '+' : '') + fmt(sVal, 2) + ' (ΔP_skin = ' + fmt(dpVal, 1) + ' psi near-wellbore pressure drop).') + '</p></div>' +
        '<div class="interp-card" style="border-left-color:#d9822b;"><h4>Flow Regime &amp; Boundary: ' + esc(it.boundary_class || (adv.regime_label || '—')) + '</h4><p>' + esc(it.boundary_summary || (adv.guidance || '—')) + '</p></div>' +
        '<div class="interp-card" style="border-left-color:#634dbf;"><h4>Engineering Recommendation</h4><p>' + esc(it.recommendation || '—') + '</p></div>';

      // 4. Complete Clickable Comparison Table (All 9+ Hidden-IARF & Deconvolution Methods!)
      const mRows = [];
      if (mf) {
        mRows.push({ key: 'manual', hl: true, name: '★ Engineer Manual 2-Point Fit (' + (mf.fit_mode === 'interval_ols' ? 'Interval OLS' : 'Exact 2-Point') + ')', m: mf.m, k: mf.k, kh: mf.kh, s: mf.skin, dp: mf.dP_skin, win: '[' + fmt(mf.win_hr[0], 2) + ' – ' + fmt(mf.win_hr[1], 2) + ' h] · R²=' + fmt(mf.r2_horner, 4) });
      }
      if (hyb) mRows.push({ key: 'hybrid_intersection', hl: !mf && activePtaMethod === 'hybrid_intersection', name: '★ Hybrid L3: Intersection Ensemble (Horner ∩ Bourdet)', m: l3.m, k: l3.k, kh: l3.kh, s: l3.skin, dp: l3.dP_skin, win: '[' + fmt(l3.win_hr[0], 2) + ' – ' + fmt(l3.win_hr[1], 2) + ' h]' });
      if (an) mRows.push({ key: 'stehfest_analytical', hl: !mf && activePtaMethod === 'stehfest_analytical', name: '★ Stehfest 12-Term Analytical Match (WBS + Skin + Boundary, SPE-12777)', m: an.m, k: an.k, kh: an.kh, s: an.skin, dp: an.dP_skin, win: 'C=' + fmt(an.c_bbl_psi, 4) + ' · r_e=' + fmt(an.re_ft, 0) + 'ft · der MAPE ' + fmt(an.deriv_mape_pct, 1) + '% (±' + fmt(an.k_std_pct, 1) + '%)' });
      if (dc) mRows.push({ key: 'von_schroeter_deconv', hl: !mf && activePtaMethod === 'von_schroeter_deconv', name: '★ von Schroeter Nonlinear Deconvolution (VFM-Coupled, SPE-77688)', m: dc.m, k: dc.k, kh: dc.kh, s: dc.skin, dp: dc.dP_skin, win: 'Extended ' + fmt(dc.horizon_hr, 0) + 'h horizon · BU RMSE ' + fmt(dc.bu_fit_rmse_psi, 1) + ' psi' });
      if (ilk) mRows.push({ key: 'ilk_bspline_deconv', hl: !mf && activePtaMethod === 'ilk_bspline_deconv', name: '★ Ilk–Valkó–Blasingame Convex B-Spline Deconvolution (SPE-102869)', m: ilk.m, k: ilk.k, kh: ilk.kh, s: ilk.skin, dp: ilk.dP_skin, win: 'Extended ' + fmt(ilk.horizon_hr, 0) + 'h · ' + ilk.n_basis + ' B-splines · RMSE ' + fmt(ilk.bu_fit_rmse_psi, 1) + ' psi' });
      if (ag) mRows.push({ key: 'agarwal_equiv', hl: !mf && activePtaMethod === 'agarwal_equiv', name: '★ Agarwal Equivalent-Time Bourdet & Semilog (SPE-9289)', m: ag.m, k: ag.k, kh: ag.kh, s: ag.skin, dp: ag.dP_skin, win: 'Δt_e [' + fmt(ag.win_hr[0], 2) + ' – ' + fmt(ag.win_hr[1], 2) + ' h] · R²=' + fmt(ag.r2_semilog, 4) });
      if (bl) mRows.push({ key: 'blasingame_integral', hl: !mf && activePtaMethod === 'blasingame_integral', name: '★ Blasingame Pressure-Integral Derivative ΔP_id (Noise-Immune, SPE-19099)', m: bl.m, k: bl.k, kh: bl.kh, s: bl.skin, dp: bl.dP_skin, win: '[' + fmt(bl.win_hr[0], 2) + ' – ' + fmt(bl.win_hr[1], 2) + ' h] · P\'_r=' + fmt(bl.radial_deriv_asymptote_psi, 1) + ' psi' });
      if (oj) mRows.push({ key: 'odeh_jones_multirate', hl: !mf && activePtaMethod === 'odeh_jones_multirate', name: '★ Odeh–Jones Multi-Rate Superposition (VFM Steps, SPE-1082)', m: oj.m, k: oj.k, kh: oj.kh, s: oj.skin, dp: oj.dP_skin, win: oj.n_rate_steps + ' VFM steps · R²=' + fmt(oj.r2_superpos, 4) });
      if (td) mRows.push({ key: 'tiab_tds', hl: !mf && activePtaMethod === 'tiab_tds', name: 'Tiab Direct Synthesis — TDS (SPE-26138)', m: td.m, k: td.k, kh: td.kh, s: td.skin, dp: td.dP_skin, win: 'C=' + fmt(td.c_bbl_psi, 4) + ' · t_peak=' + fmt(td.t_peak_hr, 3) + 'h' });
      if (mdh) mRows.push({ key: 'mdh_muskat', hl: !mf && activePtaMethod === 'mdh_muskat', name: 'MDH Semilog + Muskat Bounded Extrapolation (SPE-950)', m: mdh.m, k: mdh.k, kh: mdh.kh, s: mdh.skin, dp: mdh.dP_skin, win: 'p̄_Muskat=' + fmt(mdh.p_bar_muskat_psia, 1) + ' psia · R²=' + fmt(mdh.muskat_r2, 4) });
      if (hyb) {
        mRows.push({ key: 'hybrid_horner', hl: !mf && activePtaMethod === 'hybrid_horner', name: 'Hybrid L1: Pure Horner (Theil-Sen + PELT)', m: l1.m, k: l1.k, kh: l1.kh, s: l1.skin, dp: l1.dP_skin, win: '[' + fmt(l1.win_hr[0], 2) + ' – ' + fmt(l1.win_hr[1], 2) + ' h]' });
        mRows.push({ key: 'hybrid_bourdet', hl: !mf && activePtaMethod === 'hybrid_bourdet', name: 'Hybrid L2: Bourdet Derivative (L=0.15 + PELT)', m: l2.m, k: l2.k, kh: l2.kh, s: l2.skin, dp: l2.dP_skin, win: '[' + fmt(l2.win_hr[0], 2) + ' – ' + fmt(l2.win_hr[1], 2) + ' h]' });
      }
      mRows.push({ key: '', hl: false, name: 'Legacy Derivative Kernel', m: res.semilog_slope_psi_per_cycle, k: res.k_md, kh: res.kh_md_ft, s: res.apparent_skin, dp: res.skin_pressure_drop_psi, win: d.status });

      const mtbody = root.querySelector('#pta-methods-body');
      mtbody.innerHTML = mRows.map(r =>
        '<tr class="' + (r.hl ? 'highlight' : '') + '" ' + (r.key && r.key !== 'manual' ? ('data-ptam="' + esc(r.key) + '" style="cursor:pointer;" title="Click to display ' + esc(r.name) + '"') : '') + '>' +
          '<td><strong>' + esc(r.name) + '</strong></td>' +
          '<td class="num">' + fmt(r.m, 2) + '</td><td class="num">' + fmt(r.k, 2) + '</td>' +
          '<td class="num">' + fmt(r.kh, 0) + '</td><td class="num">' + fmt(r.s, 3) + '</td>' +
          '<td class="num">' + fmt(r.dp, 1) + '</td><td>' + esc(r.win) + '</td>' +
        '</tr>'
      ).join('');
      mtbody.querySelectorAll('tr[data-ptam]').forEach(tr => {
        tr.addEventListener('click', () => {
          activePtaMethod = tr.getAttribute('data-ptam');
          manualViewActive = false;
          const s = root.querySelector('#pta-src-sel');
          if (s) s.value = activePtaMethod;
          renderPTA(ptaData);
        });
      });
    }

    function renderPTATornado(d, activeK, activeKh, activeS, activeM) {
      const card = root.querySelector('#pta-tornado-card');
      const qs = d && d.qo_sensitivity;
      if (!card) return;
      if (!qs || !qs.available || !qs.base) {
        card.style.display = 'none';
        return;
      }
      card.style.display = 'block';
      const b = qs.base;
      const qoBase = Number(b.qo_stbd);
      const tpBase = Number(b.tp_hr) || Number((d.horner_plot || {}).tp_hr) || 1000.0;
      const kBase = (activeK && isFinite(activeK) && activeK > 0) ? Number(activeK) : Number(b.k_md);
      const sBase = (activeS !== null && activeS !== undefined && isFinite(activeS)) ? Number(activeS) : Number(b.skin);
      const mBase = (activeM && isFinite(activeM) && activeM > 0) ? Number(activeM) : Number(b.m_psi_cyc);
      const pStarBase = Number((d.horner_plot || {}).p_star_psi) || Number(b.p_star_psia);
      const pwf0 = Number(b.pwf0_psia);
      const bo = Number(b.bo), muO = Number(b.mu_o), hFt = Number(b.h_ft), phi = Number(b.phi), ct = Number(b.ct), rw = Number(b.rw_ft);
      const dpsBase = 0.869 * mBase * sBase;

      const pct = Number(tornadoQoPct) || 20;
      const frac = pct / 100.0;
      const qoLo = qoBase * (1.0 - frac);
      const qoHi = qoBase * (1.0 + frac);

      // Extract active radial-window measured buildup points (dt, Pws) for exact coupled Horner refit
      const hpPts = (d.horner_plot && d.horner_plot.points) ? d.horner_plot.points : [];
      const winHr = (d.horner_plot && d.horner_plot.win_hr) || (d.hybrid_pta && d.hybrid_pta.intersect_win_hr) || null;
      let winPts = (winHr && winHr.length === 2)
        ? hpPts.filter(p => p.dt >= winHr[0] && p.dt <= winHr[1] && p.dt > 0 && isFinite(p.y))
        : [];
      if (winPts.length < 3 && hpPts.length >= 4) {
        winPts = hpPts.slice(Math.floor(hpPts.length * 0.40), Math.floor(hpPts.length * 0.85)).filter(p => p.dt > 0 && isFinite(p.y));
      }

      // Exact coupled Horner evaluation at perturbed Qo:
      // 1) tp(Qo) = 24 * Np / Qo = tpBase * (qoBase / qoNew) shifts Horner coordinate log10((tp + dt)/dt)
      // 2) Refit Horner slope m(tp) and p*(tp) on the radial-window buildup points
      // 3) Evaluate k(Qo, m), S(Qo, m, p1hr, k), and dP_skin = 0.869 * m * S
      const evalCoupled = (qoNew) => {
        const tpNew = Math.max(tpBase * (qoBase / Math.max(qoNew, 1e-6)), 1.0);
        let mNew = mBase;
        let pStarNew = pStarBase;
        if (winPts.length >= 3) {
          let sumXb = 0, sumXn = 0, sumY = 0;
          const xb = [], xn = [], yv = [];
          for (let i = 0; i < winPts.length; i++) {
            const dt = winPts[i].dt, y = winPts[i].y;
            const bX = Math.log10((tpBase + dt) / dt);
            const nX = Math.log10((tpNew + dt) / dt);
            xb.push(bX); xn.push(nX); yv.push(y);
            sumXb += bX; sumXn += nX; sumY += y;
          }
          const n = winPts.length;
          const mXb = sumXb / n, mXn = sumXn / n, mY = sumY / n;
          let varB = 0, covB = 0, varN = 0, covN = 0;
          for (let i = 0; i < n; i++) {
            varB += (xb[i] - mXb) * (xb[i] - mXb);
            covB += (xb[i] - mXb) * (yv[i] - mY);
            varN += (xn[i] - mXn) * (xn[i] - mXn);
            covN += (xn[i] - mXn) * (yv[i] - mY);
          }
          if (varB > 1e-12 && varN > 1e-12) {
            const mOlsB = -covB / varB, mOlsN = -covN / varN;
            const psOlsB = mY + mOlsB * mXb, psOlsN = mY + mOlsN * mXn;
            if (mOlsB > 1e-6 && mOlsN > 1e-6) {
              mNew = mBase * (mOlsN / mOlsB);
              pStarNew = pStarBase + (psOlsN - psOlsB);
            }
          }
        }
        const kNew = kBase * (qoNew / qoBase) * (mBase / Math.max(mNew, 1e-6));
        const p1hrBase = pStarBase - mBase * Math.log10((tpBase + 1.0) / 1.0);
        const p1hrNew = pStarNew - mNew * Math.log10((tpNew + 1.0) / 1.0);
        const sNew = sBase + 1.1513 * (
          ((p1hrNew - pwf0) / Math.max(mNew, 1e-6)) - ((p1hrBase - pwf0) / Math.max(mBase, 1e-6))
          - Math.log10(Math.max(kNew / Math.max(kBase, 1e-6), 1e-12))
        );
        const dpsNew = 0.869 * mNew * sNew;
        return { tp: tpNew, m: mNew, pStar: pStarNew, k: kNew, s: sNew, dps: dpsNew };
      };

      const cLo = evalCoupled(qoLo);
      const cHi = evalCoupled(qoHi);
      const pctRel = (v, bVal, minD) => 100.0 * (v - bVal) / Math.max(Math.abs(bVal), minD);

      const rows = [
        {
          key: 'k', label: 'Permeability k (mD)', unit: 'mD', dec: 1,
          base: kBase, atLo: cLo.k, atHi: cHi.k,
          dLo: cLo.k - kBase, dHi: cHi.k - kBase,
          pLo: pctRel(cLo.k, kBase, 1e-6), pHi: pctRel(cHi.k, kBase, 1e-6),
          law: 'k = 162.6·Qo·Bo·μo / (m(tp)·h) — direct linear Qo + coupled Horner slope m(tp(Qo))'
        },
        {
          key: 'skin', label: 'Skin Factor S', unit: '', dec: 3,
          base: sBase, atLo: cLo.s, atHi: cHi.s,
          dLo: cLo.s - sBase, dHi: cHi.s - sBase,
          pLo: pctRel(cLo.s, sBase, 0.25), pHi: pctRel(cHi.s, sBase, 0.25),
          law: 'S(Qo, tp(Qo)) — coupled through k(Qo), Horner p1hr(tp), and refitted m(tp)'
        },
        {
          key: 'dp_skin', label: 'Skin Pressure Drop ΔP_skin (psi)', unit: 'psi', dec: 2,
          base: dpsBase, atLo: cLo.dps, atHi: cHi.dps,
          dLo: cLo.dps - dpsBase, dHi: cHi.dps - dpsBase,
          pLo: pctRel(cLo.dps, dpsBase, 1.0), pHi: pctRel(cHi.dps, dpsBase, 1.0),
          law: 'ΔP_skin = 0.869·m(tp)·S(Qo, tp) — combines coupled m(tp) and Skin S shifts'
        },
        {
          key: 'm', label: 'Horner Semilog Slope m (psi/cyc)', unit: 'psi/cyc', dec: 3,
          base: mBase, atLo: cLo.m, atHi: cHi.m,
          dLo: cLo.m - mBase, dHi: cHi.m - mBase,
          pLo: pctRel(cLo.m, mBase, 1e-6), pHi: pctRel(cHi.m, mBase, 1e-6),
          law: 'Refitted via tp = 24·Np/Qo (' + fmt(cHi.tp, 0) + '–' + fmt(cLo.tp, 0) + ' hr vs base ' + fmt(tpBase, 0) + ' hr) shifting log10((tp+Δt)/Δt)'
        }
      ];
      // Sort Tornado widest % span at top -> narrowest at bottom
      rows.sort((a, c) => (Math.abs(c.pHi - c.pLo) - Math.abs(a.pHi - a.pLo)));

      // Update header & callout
      const subEl = root.querySelector('#pta-tornado-sub');
      if (subEl) subEl.textContent = 'Coupled Qo ±' + pct + '% (' + fmt(qoLo, 0) + '–' + fmt(qoHi, 0) + ' STB/d) → tp = 24·Np/Qo (' + fmt(cLo.tp, 0) + ' / ' + fmt(cHi.tp, 0) + ' hr) → Horner refit & all 4 PTA outputs';
      const thLo = root.querySelector('#pta-th-qlo'), thHi = root.querySelector('#pta-th-qhi');
      if (thLo) thLo.textContent = 'At Qo -' + pct + '% (tp=' + fmt(cLo.tp, 0) + 'h)';
      if (thHi) thHi.textContent = 'At Qo +' + pct + '% (tp=' + fmt(cHi.tp, 0) + 'h)';

      const diagEl = root.querySelector('#pta-tornado-diag');
      diagEl.innerHTML =
        '<strong>Coupled Qo ±' + pct + '% Uncertainty (' + esc(d.well_name) + ' · Base Qo = ' + fmt(qoBase, 1) + ' STB/d, Base tp = ' + fmt(tpBase, 0) + ' hr):</strong> ' +
        'Tweaking Qo by <strong>±' + pct + '%</strong> shifts Horner producing time <strong>tp = 24·Np/Qo</strong> to <strong>' + fmt(cLo.tp, 0) + ' hr (-' + pct + '% Qo)</strong> / <strong>' + fmt(cHi.tp, 0) + ' hr (+' + pct + '% Qo)</strong>, ' +
        'refitting <strong>Horner Slope m</strong> to <strong>' + fmt(cLo.m, 3) + '–' + fmt(cHi.m, 3) + ' psi/cyc</strong> (' + (pctRel(cLo.m, mBase, 1e-6) >= 0 ? '+' : '') + fmt(pctRel(cLo.m, mBase, 1e-6), 2) + '% / ' + (pctRel(cHi.m, mBase, 1e-6) >= 0 ? '+' : '') + fmt(pctRel(cHi.m, mBase, 1e-6), 2) + '%), ' +
        '<strong>Permeability k</strong> to <strong>' + fmt(cLo.k, 1) + '–' + fmt(cHi.k, 1) + ' mD</strong>, ' +
        '<strong>Skin S</strong> to <strong>' + (cLo.s >= 0 ? '+' : '') + fmt(cLo.s, 3) + ' / ' + (cHi.s >= 0 ? '+' : '') + fmt(cHi.s, 3) + '</strong>, and ' +
        '<strong>ΔP_skin</strong> to <strong>' + fmt(cLo.dps, 1) + ' / ' + fmt(cHi.dps, 1) + ' psi</strong>.';

      // Diverging horizontal Tornado chart centered at 0% Change
      const maxAbsPct = Math.max(pct + 14, ...rows.map(r => Math.max(Math.abs(r.pLo), Math.abs(r.pHi)))) + 14;
      const labels = rows.map(r => r.label);
      const barAtQoLo = rows.map(r => [Math.min(0, r.pLo), Math.max(0, r.pLo)]);
      const barAtQoHi = rows.map(r => [Math.min(0, r.pHi), Math.max(0, r.pHi)]);

      const tornadoAnnotPlugin = {
        id: 'ptaTornadoAnnot',
        afterDatasetsDraw(ch) {
          const xS = ch.scales.x, yS = ch.scales.y, ca = ch.chartArea;
          if (!xS || !yS || !ca) return;
          const x0 = xS.getPixelForValue(0);
          const ctx = ch.ctx;
          ctx.save();
          // Vertical dashed 0% baseline
          ctx.strokeStyle = '#10161a';
          ctx.lineWidth = 1.8;
          ctx.setLineDash([5, 3]);
          ctx.beginPath();
          ctx.moveTo(x0, ca.top);
          ctx.lineTo(x0, ca.bottom);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle = '#10161a';
          ctx.font = '700 10.5px Consolas, monospace';
          ctx.textAlign = 'center';
          ctx.fillText('Base (0%)', x0, ca.top - 6);

          // Inline value annotations at bar tips
          ctx.font = '600 10.5px Consolas, monospace';
          ctx.textBaseline = 'middle';
          rows.forEach((r, idx) => {
            const yPix = yS.getPixelForValue(idx);
            if (Math.abs(r.pLo) < 0.005 && Math.abs(r.pHi) < 0.005) {
              ctx.fillStyle = '#64748b';
              ctx.textAlign = 'left';
              ctx.fillText('≈0.00% (' + fmt(r.atLo, r.dec) + '–' + fmt(r.atHi, r.dec) + ' ' + r.unit + ')', x0 + 8, yPix);
              return;
            }
            const leftVal = r.pLo < r.pHi ? r.pLo : r.pHi;
            const rightVal = r.pLo < r.pHi ? r.pHi : r.pLo;
            const leftAbs = r.pLo < r.pHi ? r.atLo : r.atHi;
            const rightAbs = r.pLo < r.pHi ? r.atHi : r.atLo;
            const xL = xS.getPixelForValue(leftVal);
            const xR = xS.getPixelForValue(rightVal);
            const pDec = Math.abs(rightVal - leftVal) < 1.0 ? 2 : 1;
            ctx.fillStyle = '#1d4ed8';
            ctx.textAlign = 'right';
            ctx.fillText((leftVal >= 0 ? '+' : '') + fmt(leftVal, pDec) + '% (' + fmt(leftAbs, r.dec) + ')', xL - 6, yPix);
            ctx.fillStyle = '#b91c1c';
            ctx.textAlign = 'left';
            ctx.fillText((rightVal >= 0 ? '+' : '') + fmt(rightVal, pDec) + '% (' + fmt(rightAbs, r.dec) + ')', xR + 6, yPix);
          });
          ctx.restore();
        }
      };

      tornadoChart = chart(root.querySelector('#pta-tornado-canvas'), {
        type: 'bar',
        data: {
          labels,
          datasets: [
            {
              label: 'Qo -' + pct + '% (' + fmt(qoLo, 0) + ' STB/d)',
              data: barAtQoLo,
              backgroundColor: 'rgba(45, 114, 210, 0.88)',
              borderColor: '#1d4ed8',
              borderWidth: 1,
              borderRadius: 3,
              barPercentage: 0.62,
              grouped: false
            },
            {
              label: 'Qo +' + pct + '% (' + fmt(qoHi, 0) + ' STB/d)',
              data: barAtQoHi,
              backgroundColor: 'rgba(219, 55, 55, 0.86)',
              borderColor: '#b91c1c',
              borderWidth: 1,
              borderRadius: 3,
              barPercentage: 0.62,
              grouped: false
            }
          ]
        },
        plugins: [tornadoAnnotPlugin],
        options: {
          indexAxis: 'y',
          layout: { padding: { top: 20, left: 8, right: 16 } },
          plugins: {
            legend: { position: 'top', align: 'end', labels: { font: { size: 11.5 }, boxWidth: 13 } },
            tooltip: {
              callbacks: {
                label: ctx => {
                  const r = rows[ctx.dataIndex];
                  const isLo = ctx.datasetIndex === 0;
                  const val = isLo ? r.atLo : r.atHi;
                  const pChg = isLo ? r.pLo : r.pHi;
                  const dAbs = isLo ? r.dLo : r.dHi;
                  return ctx.dataset.label + ' → ' + r.label + ' = ' + fmt(val, r.dec) + ' ' + r.unit + ' (Δ ' + (dAbs >= 0 ? '+' : '') + fmt(dAbs, r.dec) + ', ' + (pChg >= 0 ? '+' : '') + fmt(pChg, 1) + '%)';
                }
              }
            }
          },
          scales: {
            x: {
              min: -maxAbsPct,
              max: maxAbsPct,
              title: { display: true, text: '% Change in PTA Output Relative to Base Value (Centered at 0%)' },
              ticks: { callback: v => (v > 0 ? '+' : '') + v + '%' },
              grid: { color: '#edf2f7' }
            },
            y: {
              ticks: { font: { size: 11.5, weight: '700' } },
              grid: { display: false }
            }
          }
        }
      });

      // Exact 4-row numeric table (Permeability k, Skin S, ΔP_skin, Horner Slope m)
      const tbody = root.querySelector('#pta-tornado-body');
      tbody.innerHTML = rows.map(r =>
        '<tr class="' + (r.key === 'k' ? 'highlight' : '') + '">' +
          '<td><strong>' + esc(r.label) + '</strong></td>' +
          '<td class="num"><strong>' + fmt(r.base, r.dec) + (r.unit ? ' ' + esc(r.unit) : '') + '</strong></td>' +
          '<td class="num" style="color:#1d4ed8;">' + fmt(r.atLo, r.dec) + (r.unit ? ' ' + esc(r.unit) : '') + '</td>' +
          '<td class="num" style="color:#b91c1c;">' + fmt(r.atHi, r.dec) + (r.unit ? ' ' + esc(r.unit) : '') + '</td>' +
          '<td class="num">' + (r.dLo >= 0 ? '+' : '') + fmt(r.dLo, r.dec) + ' / ' + (r.dHi >= 0 ? '+' : '') + fmt(r.dHi, r.dec) + '</td>' +
          '<td class="num"><strong>' + (r.pLo >= 0 ? '+' : '') + fmt(r.pLo, 1) + '% / ' + (r.pHi >= 0 ? '+' : '') + fmt(r.pHi, 1) + '%</strong></td>' +
          '<td style="font-size:11.5px; color:#394b59;">' + esc(r.law) + '</td>' +
        '</tr>'
      ).join('');
    }

    registerTab({
      id: 'pta',
      title: 'PTA & Reservoir Behaviour',
      order: 4,
      render(c) { root = c; buildSkeleton(c); },
      onShow() { refreshWellEvents(); },
      onWellChange() { if (root && root.classList.contains('active')) refreshWellEvents(); }
    });
  })();

  // Header Export Actions
  document.getElementById('hdr-dl-vfm').addEventListener('click', () => {
    window.location.href = '/api/export/vfm?model=' + encodeURIComponent(state.activeModel || 'synth_stacked_v2') + '&rate_type=alloc&format=xlsx';
  });
  document.getElementById('hdr-dl-pta').addEventListener('click', () => {
    window.location.href = '/api/export/pta?source=hybrid_intersection&format=xlsx';
  });
  document.getElementById('hdr-dl-rep').addEventListener('click', () => {
    window.location.href = '/api/export/report';
  });

  // Startup Polling
  async function pollStartup() {
    const banner = document.getElementById('startup-banner');
    const stText = document.getElementById('startup-status-text');
    const pill = document.getElementById('hdr-status-pill');
    try {
      const st = await api('/api/status');
      if (st.error) {
        banner.className = 'startup-banner error';
        stText.textContent = 'Error: ' + st.error;
        pill.textContent = 'Error';
        return;
      }
      if (!st.ready) {
        stText.textContent = 'Starting workbench: ' + (st.status || 'initializing') + '...';
        pill.textContent = st.status || 'Starting...';
        setTimeout(pollStartup, 1200);
        return;
      }
      const [ov, mData] = await Promise.all([api('/api/overview'), api('/api/models')]);
      state.overview = ov;
      modelsData = mData;
      state.currentWell = (ov.wells && ov.wells.length) ? ov.wells[0].well_name : null;
      banner.classList.add('hidden');
      pill.textContent = 'Ready · vfm_stacked_v2.pkl';
      pill.classList.add('ready');
      ['hdr-dl-vfm', 'hdr-dl-pta', 'hdr-dl-rep'].forEach(id => { document.getElementById(id).disabled = false; });
      renderSidebar();
      activateTab('monitoring');
    } catch (err) {
      stText.textContent = 'Waiting for server: ' + err.message;
      setTimeout(pollStartup, 1500);
    }
  }

  window.addEventListener('DOMContentLoaded', pollStartup);
})();
</script>
<script src="/static/tab_monitoring.js?v=20261122c"></script>
</body>
